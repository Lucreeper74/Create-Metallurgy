plugins {
    id("idea")
    id("java-library")
    id("maven-publish")
    id("net.neoforged.moddev") version "2.0.141" // https://projects.neoforged.net/neoforged/ModDevGradle
}

base {
    archivesName = "createmetallurgy-${mod_version}-${mc_version}"
    group = "fr.lucreeper74.createmetallurgy"
    version = "${mod_version}-${mc_version}"
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

neoForge {
    version = neo_version

    accessTransformers = files("src/main/resources/META-INF/accesstransformer.cfg")

    if (parchment_version != "none") {
        parchment {
            minecraftVersion = parchment_mc_version == "same" ? mc_version : parchment_mc_version
            mappingsVersion = parchment_version
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll(
                    "--mod", "${mod_id}",
                    "--all",
                    "--output", file("src/generated/resources/").getAbsolutePath(),
                    "--existing", file("src/main/resources/").getAbsolutePath(),
                    "--existing-mod", "kubejs"
            )
        }

        gameTestServer {
            type = "gameTestServer"
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // For Create
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate

    // For JEI
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://modmaven.dev" }

    // For Jade
    maven { url = "https://api.modrinth.com/maven" }

    // For Architectury
    maven { url = "https://maven.architectury.dev"; content { includeGroup "dev.architectury" }}

    // For KubeJS
    maven { url = "https://maven.latvian.dev/releases"; content {includeGroup "dev.latvian.mods"; includeGroup "dev.latvian.apps"}}
    maven { url = "https://jitpack.io"; content {includeGroup "com.github.rtyley"}}

    // For CurseForge project
    maven { url = "https://cursemaven.com"; content { includeGroup "curse.maven" }}
}

dependencies {
    // Create needed
    implementation("com.simibubi.create:create-${mc_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${mc_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${mc_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${mc_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // KubeJS stuff
    api("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")
    api("dev.latvian.mods:kubejs-create-neoforge:${createjs_version}")
    compileOnly("curse.maven:create-heat-js-${heatjs_id}:${heatjs_file}")
    // ADD IT ONLY WHEN NEEDED IN-GAME (Mixin code will make uppercase in recipe heat condition in datagen)
    //runtimeOnly("curse.maven:create-heat-js-${heatjs_id}:${heatjs_file}")

    // Jei stuff
    compileOnly("mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${mc_version}-neoforge:${jei_version}")

    // Jade stuff
    implementation("maven.modrinth:jade:${jade_version}")
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            "mod_version"           : mod_version,
            "mod_id"                : mod_id,
            "mod_name"              : mod_name,
            "mod_author"            : mod_author,
            "mod_description"       : mod_description,
            "mod_license"           : mod_license,
            "neo_version"           : neo_version,
            "jei_version"           : jei_version,
            "jade_version"          : jade_version,
            "kubejs_version"        : kubejs_version,
            "createjs_version"      : createjs_version,
            "minecraft_version"            : mc_version,
            "minecraft_version_range"      : mc_version_range,
            "create_version_range"         : create_version_range,
    ]
    inputs.properties(replaceProperties)
    expand(replaceProperties)
    from("src/main/templates")
    into("build/generated/sources/modMetadata")
}

sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}